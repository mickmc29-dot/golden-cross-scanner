name: Run golden cross scan

on:
  schedule:
    # 21:30 UTC on weekdays = 4:30pm ET / 3:30pm CT — just after US market close.
    # GitHub cron is always UTC and does not adjust for daylight saving,
    # so this shifts by an hour relative to local time twice a year.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:      # lets you trigger a run manually from the Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the scan
        run: python run_scan.py

      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json
          if git diff --staged --quiet; then
            echo "No change in results — nothing to commit."
          else
            git commit -m "Update scan results [skip render]"
            git push
          fi
