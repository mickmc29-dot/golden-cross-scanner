<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Cross Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1720;
    --surface: #161F2B;
    --surface-2: #1D2733;
    --border: #2A3542;
    --text: #E7E3DC;
    --text-muted: #8B96A5;
    --teal: #4FA697;
    --rust: #C1666B;
    --amber: #D4A24C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .num { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }

  .app { max-width: 480px; margin: 0 auto; padding: 20px 16px 60px; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 4px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .last-run {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .run-btn {
    background: var(--teal);
    color: #0F1720;
    border: none;
    border-radius: 6px;
    padding: 9px 14px;
    font-family: inherit;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  .run-btn:active { opacity: 0.8; }
  .run-btn:disabled { opacity: 0.5; }

  .filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 16px 0 4px;
    margin-bottom: 8px;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    border-radius: 20px;
    padding: 7px 13px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.active {
    border-color: var(--amber);
    color: var(--amber);
    background: rgba(212,162,76,0.08);
  }

  .sort-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--text-muted);
    margin: 12px 2px 8px;
  }
  select {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: inherit;
    font-size: 12px;
    padding: 5px 8px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .ticker-block { display: flex; align-items: baseline; gap: 10px; }
  .ticker { font-size: 17px; font-weight: 600; }
  .price { font-size: 15px; color: var(--text-muted); }
  .score {
    font-size: 20px;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 6px;
  }
  .score.high { background: rgba(79,166,151,0.15); color: var(--teal); }
  .score.mid { background: rgba(212,162,76,0.15); color: var(--amber); }
  .score.low { background: rgba(193,102,107,0.15); color: var(--rust); }

  .meta-row {
    display: flex;
    gap: 14px;
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .meta-row span b { color: var(--text); font-weight: 500; }

  .toggle {
    margin-top: 10px;
    font-size: 12px;
    color: var(--amber);
    cursor: pointer;
  }

  .detail {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .detail.open { display: block; }
  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 16px;
    font-size: 12px;
  }
  .detail-grid div { display: flex; justify-content: space-between; }
  .detail-grid div span:first-child { color: var(--text-muted); }
  .flags {
    margin-top: 10px;
    font-size: 12px;
    color: var(--text);
    background: var(--surface-2);
    border-radius: 6px;
    padding: 8px 10px;
  }

  .empty {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    padding: 40px 0;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Golden Cross Scanner</h1>
      <div class="last-run" id="lastRun">Last run — Sep 8, 2026, 4:12 PM</div>
    </div>
    <button class="run-btn" id="runBtn">Run scan</button>
  </header>

  <div class="filters" id="sectorFilters"></div>

  <div class="sort-row">
    <span id="resultCount">5 results</span>
    <select id="sortSelect">
      <option value="score">Sort: Score</option>
      <option value="days_since_cross">Sort: Days since cross</option>
      <option value="rsi">Sort: RSI</option>
      <option value="revenue_growth_pct">Sort: Revenue growth</option>
    </select>
  </div>

  <div id="cards"></div>
  <div class="empty" id="emptyState" style="display:none;">No tickers match these filters.</div>
</div>

<script>
let data = [
  {ticker:"CBOE",price:293.33,ma50:284.57,ma200:284.08,rsi:51.8,days_since_cross:0,golden_cross_recent:true,ma50_decline_days_before_turn:14,ma50_had_sustained_decline:true,days_below_ma200_before_cross:22,had_sustained_below_ma200:true,ma50_turning_up:true,ma200_turning_up:true,price_above_both_mas:true,volume_confirming:false,off_recent_low_pct:27.1,is_off_recent_low:true,sector:"Financial Services",debt_to_ebitda:0.82,interest_coverage:12.4,revenue_growth_pct:22.9,earnings_growth_pct:50.2,profit_margin_pct:26.7,fundamental_flags:"no major red flags",passes_fundamental_filter:true,score:6,ex_dividend_date:"2026-09-05",dividend_amount:2.16,next_earnings_date:"2026-10-24"},
  {ticker:"APO",price:131.81,ma50:126.87,ma200:126.81,rsi:46.6,days_since_cross:0,golden_cross_recent:true,ma50_decline_days_before_turn:11,ma50_had_sustained_decline:true,days_below_ma200_before_cross:29,had_sustained_below_ma200:true,ma50_turning_up:true,ma200_turning_up:true,price_above_both_mas:true,volume_confirming:false,off_recent_low_pct:15.3,is_off_recent_low:true,sector:"Financial Services",debt_to_ebitda:null,interest_coverage:null,revenue_growth_pct:63.8,earnings_growth_pct:63.7,profit_margin_pct:5.3,fundamental_flags:"no major red flags",passes_fundamental_filter:true,score:6,ex_dividend_date:"2026-09-29",dividend_amount:1.85,next_earnings_date:"2026-11-04"},
  {ticker:"REGN",price:810.31,ma50:740.83,ma200:730.83,rsi:50.0,days_since_cross:2,golden_cross_recent:true,ma50_decline_days_before_turn:18,ma50_had_sustained_decline:true,days_below_ma200_before_cross:57,had_sustained_below_ma200:true,ma50_turning_up:true,ma200_turning_up:true,price_above_both_mas:true,volume_confirming:false,off_recent_low_pct:33.4,is_off_recent_low:true,sector:"Healthcare",debt_to_ebitda:0.58,interest_coverage:9.1,revenue_growth_pct:16.7,earnings_growth_pct:-4.5,profit_margin_pct:27.9,fundamental_flags:"no major red flags",passes_fundamental_filter:true,score:6,ex_dividend_date:null,dividend_amount:null,next_earnings_date:"2026-11-05"},
  {ticker:"CMG",price:36.96,ma50:34.94,ma200:34.88,rsi:69.2,days_since_cross:1,golden_cross_recent:true,ma50_decline_days_before_turn:0,ma50_had_sustained_decline:false,days_below_ma200_before_cross:199,had_sustained_below_ma200:true,ma50_turning_up:true,ma200_turning_up:true,price_above_both_mas:true,volume_confirming:false,off_recent_low_pct:21.0,is_off_recent_low:true,sector:"Consumer Cyclical",debt_to_ebitda:2.38,interest_coverage:3.7,revenue_growth_pct:9.3,earnings_growth_pct:-1.3,profit_margin_pct:11.4,fundamental_flags:"no major red flags",passes_fundamental_filter:true,score:6,ex_dividend_date:null,dividend_amount:null,next_earnings_date:"2026-10-28"},
  {ticker:"KNSL",price:367.29,ma50:361.05,ma200:357.37,rsi:46.4,days_since_cross:2,golden_cross_recent:true,ma50_decline_days_before_turn:85,ma50_had_sustained_decline:true,days_below_ma200_before_cross:198,had_sustained_below_ma200:true,ma50_turning_up:false,ma200_turning_up:true,price_above_both_mas:false,volume_confirming:true,off_recent_low_pct:24.6,is_off_recent_low:true,sector:"Financial Services",debt_to_ebitda:0.31,interest_coverage:15.6,revenue_growth_pct:16.8,earnings_growth_pct:34.0,profit_margin_pct:28.5,fundamental_flags:"no major red flags",passes_fundamental_filter:true,score:6,ex_dividend_date:"2026-09-19",dividend_amount:0.35,next_earnings_date:"2026-10-29"}
];

let activeSector = "All";
let sortKey = "score";
const openCards = new Set();

function sectors() {
  return ["All", ...new Set(data.map(d => d.sector))];
}

function renderFilters() {
  const el = document.getElementById("sectorFilters");
  el.innerHTML = "";
  sectors().forEach(s => {
    const chip = document.createElement("div");
    chip.className = "chip" + (s === activeSector ? " active" : "");
    chip.textContent = s;
    chip.onclick = () => { activeSector = s; render(); };
    el.appendChild(chip);
  });
}

function scoreClass(s) {
  if (s >= 7) return "high";
  if (s >= 5) return "mid";
  return "low";
}

function fmt(v, digits=1) {
  return (v === null || v === undefined) ? "—" : Number(v).toFixed(digits);
}

function render() {
  renderFilters();
  let rows = data.filter(d => activeSector === "All" || d.sector === activeSector);
  rows = rows.slice().sort((a,b) => (b[sortKey] ?? -Infinity) - (a[sortKey] ?? -Infinity));

  document.getElementById("resultCount").textContent = rows.length + " result" + (rows.length === 1 ? "" : "s");

  const container = document.getElementById("cards");
  container.innerHTML = "";
  document.getElementById("emptyState").style.display = rows.length ? "none" : "block";

  rows.forEach(d => {
    const isOpen = openCards.has(d.ticker);
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-top">
        <div class="ticker-block">
          <span class="ticker">${d.ticker}</span>
          <span class="price num">$${fmt(d.price,2)}</span>
        </div>
        <div class="score ${scoreClass(d.score)} num">${d.score}</div>
      </div>
      <div class="meta-row">
        <span>${d.sector}</span>
        <span>Cross <b>${d.days_since_cross != null ? d.days_since_cross + "d ago" : "none recent"}</b></span>
        <span>RSI <b>${fmt(d.rsi)}</b></span>
      </div>
      <div class="meta-row">
        <span>Next earnings <b>${d.next_earnings_date ?? "—"}</b></span>
        <span>Ex-div <b>${d.ex_dividend_date ?? "—"}</b></span>
      </div>
      <div class="toggle">${isOpen ? "Hide details ▲" : "Show details ▼"}</div>
      <div class="detail ${isOpen ? "open" : ""}">
        <div class="detail-grid">
          <div><span>MA50</span><span class="num">${fmt(d.ma50,2)}</span></div>
          <div><span>MA200</span><span class="num">${fmt(d.ma200,2)}</span></div>
          <div><span>MA50 turning up</span><span>${d.ma50_turning_up ? "Yes" : "No"}</span></div>
          <div><span>MA200 turning up</span><span>${d.ma200_turning_up ? "Yes" : "No"}</span></div>
          <div><span>Golden cross (recent)</span><span>${d.golden_cross_recent ? "Yes" : "No"}</span></div>
          <div><span>Sustained MA50 decline</span><span>${d.ma50_had_sustained_decline ? "Yes (" + d.ma50_decline_days_before_turn + "d)" : "No"}</span></div>
          <div><span>Sustained below MA200</span><span>${d.had_sustained_below_ma200 ? "Yes (" + d.days_below_ma200_before_cross + "d)" : "No"}</span></div>
          <div><span>Price above both MAs</span><span>${d.price_above_both_mas ? "Yes" : "No"}</span></div>
          <div><span>Off recent low (bottoming)</span><span>${d.is_off_recent_low ? "Yes" : "No"}</span></div>
          <div><span>Volume confirming</span><span>${d.volume_confirming ? "Yes" : "No"}</span></div>
          <div><span>Off recent low</span><span class="num">${fmt(d.off_recent_low_pct)}%</span></div>
          <div><span>Debt / EBITDA</span><span class="num">${fmt(d.debt_to_ebitda,2)}</span></div>
          <div><span>Interest coverage</span><span class="num">${fmt(d.interest_coverage,2)}</span></div>
          <div><span>Profit margin</span><span class="num">${fmt(d.profit_margin_pct)}%</span></div>
          <div><span>Revenue growth</span><span class="num">${fmt(d.revenue_growth_pct)}%</span></div>
          <div><span>Earnings growth</span><span class="num">${fmt(d.earnings_growth_pct)}%</span></div>
          <div><span>Passes fundamental filter</span><span>${d.passes_fundamental_filter ? "Yes" : "No"}</span></div>
          <div><span>Dividend amount</span><span class="num">${d.dividend_amount ? "$"+fmt(d.dividend_amount,2) : "—"}</span></div>
        </div>
        <div class="flags">${d.fundamental_flags}</div>
      </div>
    `;
    card.querySelector(".toggle").onclick = () => {
      if (openCards.has(d.ticker)) openCards.delete(d.ticker); else openCards.add(d.ticker);
      render();
    };
    container.appendChild(card);
  });
}

document.getElementById("sortSelect").onchange = (e) => { sortKey = e.target.value; render(); };

const API_URL = "/scan";

document.getElementById("runBtn").onclick = async () => {
  const btn = document.getElementById("runBtn");
  const lastRunEl = document.getElementById("lastRun");
  btn.disabled = true;
  btn.textContent = "Scanning…";
  lastRunEl.textContent = "Waking up scanner — can take up to a minute if it's been idle…";

  try {
    const response = await fetch(API_URL);
    if (!response.ok) throw new Error("Server returned " + response.status);
    const payload = await response.json();
    data = payload.results;
    const runTime = new Date(payload.last_run);
    lastRunEl.textContent = "Last run — " + runTime.toLocaleString();
    render();
  } catch (err) {
    lastRunEl.textContent = "Scan failed — " + err.message + ". Try again in a moment.";
  } finally {
    btn.disabled = false;
    btn.textContent = "Run scan";
  }
};

render();
</script>
</body>
</html>
